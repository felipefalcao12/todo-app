# Nginx do frontend: entrega o React e encaminha a API no mesmo endereço.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver do Docker: o nome "backend" é resolvido a cada requisição,
    # assim o Nginx sobe mesmo que a API ainda não esteja pronta.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:5000;

    # /todos e /todos/:id -> API, preservando método e caminho
    location /todos {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Saúde da API (inclui a conexão com o MongoDB)
    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Saúde do próprio Nginx
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
