- name: Aguardar o cloud-init terminar (evita disputa pelo lock do apt)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Definir fuso horário
  community.general.timezone:
    name: "{{ timezone }}"

- name: Atualizar o índice de pacotes (cache válido por 1h)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
  changed_when: false  # atualizar o índice não altera o sistema

- name: Normalizar a lista de pacotes extras (aceita lista ou "a,b,c")
  ansible.builtin.set_fact:
    extra_packages_list: >-
      {{ (extra_packages if (extra_packages is iterable and extra_packages is not string)
          else (extra_packages | default('') | string).split(','))
         | map('trim') | reject('equalto', '') | list }}

- name: Instalar e manter pacotes base e extras
  ansible.builtin.apt:
    name: "{{ base_packages + extra_packages_list }}"
    state: present
    lock_timeout: 600

- name: Listar pacotes extras aplicados
  ansible.builtin.debug:
    msg: "Pacotes extras: {{ extra_packages_list | join(', ') if extra_packages_list else 'nenhum' }}"

# --- Swap: proteção contra falta de memória em VMs pequenas (t3.micro) -------
- name: Verificar arquivo de swap
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile

- name: Criar arquivo de swap ({{ swap_size_mb }} MB)
  ansible.builtin.command: fallocate -l {{ swap_size_mb }}M /swapfile
  when: not swapfile.stat.exists
  changed_when: true

- name: Proteger e formatar o swap
  ansible.builtin.shell: chmod 600 /swapfile && mkswap /swapfile
  when: not swapfile.stat.exists
  changed_when: true

- name: Verificar swap ativo
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_active
  changed_when: false

- name: Ativar swap
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in swap_active.stdout"
  changed_when: true

- name: Swap persistente após reinício
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Preferir RAM e usar swap só sob pressão
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_set: true
