# Gerado automaticamente pela pipeline (scripts/gen-inventory.sh) a partir
# dos outputs do Terraform. Exemplo da estrutura:
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/pm04
    app_domain: 3-91-10-20.sslip.io
    db_private_ip: 10.20.2.15
    db_public_ip: 54.10.20.30
    mongo_volume_id: vol-0123456789abcdef0
    backup_bucket: pm04-backups-123456789012
    backup_prefix: todo-app/dev
    aws_region: us-east-1
  children:
    app:
      hosts:
        app-vm:
          ansible_host: 3.91.10.20
    db:
      hosts:
        db-vm:
          ansible_host: 10.20.2.15
          # o banco não aceita SSH da internet: acesso via VM da aplicação
          ansible_ssh_common_args: -o ProxyCommand="ssh -W %h:%p -q -i ~/.ssh/pm04 -o StrictHostKeyChecking=accept-new ubuntu@3.91.10.20"
