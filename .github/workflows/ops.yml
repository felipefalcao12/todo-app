name: "Ops · Rotinas operacionais"

# Rotinas para os alunos antes e durante a feira, sem acesso manual às VMs.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente"
        type: choice
        options: [dev, homolog, prod]
        default: dev
      operation:
        description: "Rotina a executar"
        type: choice
        options:
          - health          # saúde de VMs, contêineres, API->banco e URL pública
          - logs            # últimos logs de MongoDB, API, Nginx, Caddy e backups
          - restart         # reinício controlado dos serviços
          - backup          # backup imediato para o S3
          - restore-test    # restauração em ambiente isolado (não toca na demo)
          - restore         # restauração do banco principal (faz backup antes)
          - reset-demo      # nova lista de demonstração (faz backup antes)
          - isolation-test  # prova que a porta 27017 não é acessível da internet
          - reboot-vm       # reinicia a(s) VM(s) pela API da AWS (VM sem resposta)
        default: health
      service:
        description: "restart/reboot-vm: quais serviços (app = VM da aplicação, mongo = VM do banco)"
        type: choice
        options: [all, app, mongo]
        default: all
      backup_file:
        description: "restore/restore-test: arquivo do backup (ou latest)"
        type: string
        default: latest
      log_lines:
        description: "logs: quantidade de linhas"
        type: string
        default: "100"

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  ops:
    name: "${{ inputs.operation }} (${{ inputs.environment }})"
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Credenciais AWS (secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Preparar Terraform
        uses: ./.github/actions/terraform-setup
        with:
          environment: ${{ inputs.environment }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ler outputs do estado
        working-directory: infra/terraform
        run: |
          terraform output -json > ../../tf-outputs.json
          if [ "$(jq 'has("app_public_ip")' ../../tf-outputs.json)" != "true" ]; then
            echo "::error::Ambiente ${{ inputs.environment }} não existe. Execute a pipeline Infra primeiro."; exit 1
          fi

      - name: Reiniciar VM pela API da AWS (recuperação sem SSH)
        if: inputs.operation == 'reboot-vm'
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          APP_ID="$(jq -r .inventory.value.app.id tf-outputs.json)"
          DB_ID="$(jq -r .inventory.value.db.id tf-outputs.json)"
          case "$SERVICE" in
            app) IDS="$APP_ID" ;;
            mongo) IDS="$DB_ID" ;;
            *) IDS="$APP_ID $DB_ID" ;;
          esac
          # Diagnóstico antes do reinício (sem dados sensíveis)
          for ID in $IDS; do
            echo "=== $ID ==="
            aws ec2 describe-instance-credit-specifications --instance-ids "$ID" \
              --query 'InstanceCreditSpecifications[0].CpuCredits' --output text | sed 's/^/Modo de créditos de CPU: /'
            aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name CPUCreditBalance \
              --dimensions Name=InstanceId,Value="$ID" --statistics Minimum \
              --start-time "$(date -u -d '-30 min' +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" --period 300 \
              --query 'sort_by(Datapoints,&Timestamp)[].Minimum' --output text | sed 's/^/Saldo de créditos (30 min): /' || true
            aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name CPUUtilization \
              --dimensions Name=InstanceId,Value="$ID" --statistics Maximum \
              --start-time "$(date -u -d '-30 min' +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" --period 300 \
              --query 'sort_by(Datapoints,&Timestamp)[].Maximum' --output text | sed 's/^/CPU máxima % (30 min): /' || true
            aws ec2 get-console-output --instance-id "$ID" --latest --output text --query Output 2>/dev/null \
              | grep -iE 'oom|out of memory|killed process|error|fail|hung' | tail -n 20 || true
          done
          # stop/start (em vez de reboot) move a VM para outro host físico.
          # O IP privado e o volume de dados são mantidos.
          echo "Parando e iniciando: $IDS"
          # shellcheck disable=SC2086
          aws ec2 stop-instances --instance-ids $IDS >/dev/null
          # shellcheck disable=SC2086
          aws ec2 wait instance-stopped --instance-ids $IDS
          # shellcheck disable=SC2086
          aws ec2 start-instances --instance-ids $IDS >/dev/null
          # shellcheck disable=SC2086
          aws ec2 wait instance-status-ok --instance-ids $IDS
          sleep 20
          {
            echo "## Rotina \`reboot-vm\` em \`${{ inputs.environment }}\`"
            echo "VM(s) reiniciada(s) e com status OK: \`$IDS\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # O Ansible a seguir confere a saúde dos serviços após o reinício
          echo "OPERATION_OVERRIDE=health" >> "$GITHUB_ENV"

      - name: Preparar Ansible
        uses: ./.github/actions/ansible-setup
        with:
          outputs-file: tf-outputs.json

      - name: Executar rotina ${{ inputs.operation }}
        working-directory: infra/ansible
        env:
          OPERATION_INPUT: ${{ inputs.operation }}
          SERVICE: ${{ inputs.service }}
          BACKUP_FILE: ${{ inputs.backup_file }}
          LOG_LINES: ${{ inputs.log_lines }}
          ANSIBLE_FORCE_COLOR: "true"
        run: |
          set -o pipefail
          OPERATION="${OPERATION_OVERRIDE:-$OPERATION_INPUT}"
          jq -n --arg operation "$OPERATION" --arg service "$SERVICE" \
                --arg backup_file "$BACKUP_FILE" --arg log_lines "$LOG_LINES" \
                --arg backup_label "$OPERATION" '$ARGS.named' > vars.json
          ansible-playbook playbooks/ops.yml -e @vars.json | tee ops.log
          {
            echo "## Rotina \`${OPERATION}\` em \`${{ inputs.environment }}\`"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' ops.log | grep -E '"msg"|^ok:|^changed:|RESTAURACAO|Backup|BLOQUEADO|->|Tarefas|PLAY RECAP|app-vm|db-vm|localhost' | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remover acesso SSH temporário do runner
        if: always() && env.APP_SG_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$APP_SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" >/dev/null 2>&1 || true
          echo "Regra SSH temporária removida (${RUNNER_CIDR})"
