# Execução local (um único host). Na nuvem, aplicação e banco ficam em VMs
# distintas e a implantação é feita pelo Ansible (ver ansible/).
#
# Copie .env.example para .env e defina as senhas antes de subir.

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"            # único ponto de entrada: interface + /todos
    networks:
      - todo-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USER:-todo_app}:${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD no .env}@mongo:27017/todo-app?authSource=todo-app
    networks:
      - todo-net
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    # sem "ports": a API só é acessada pelo Nginx do frontend

  mongo:
    build:
      context: ./banco-de-dados
    container_name: mongo-todo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}
      MONGO_INITDB_DATABASE: todo-app
      MONGO_APP_USER: ${MONGO_APP_USER:-todo_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db  # volume nomeado: dados sobrevivem à recriação
    networks:
      - todo-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # sem "ports": o banco não é publicado fora da rede do Docker

volumes:
  mongo-data:

networks:
  todo-net:
    driver: bridge
